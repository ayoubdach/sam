<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D0A">
<title>Samart — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--or:#FF6B1A;--or2:#FF8C42;--wall:#100D0A;--panel:#1A140E;--panel2:#241B12;--line:rgba(247,238,222,.09);--line2:rgba(247,238,222,.18);--tx:#F6EFE2;--dim:rgba(246,239,226,.6);--faint:rgba(246,239,226,.36);--bad:#F0605F;--ok:#5CC48C;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--wall);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(520px circle at var(--mx,50%) var(--my,-10%),rgba(255,160,80,.16),transparent 65%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
.hide{display:none!important}
#app{position:relative;z-index:1}
.serif{font-family:var(--serif)}
/* controls */
.btn{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:10px 16px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:rgba(255,255,255,.05)}
.btn.pri{background:linear-gradient(180deg,var(--or2),var(--or));border-color:transparent;color:#1a0d02;font-weight:600;box-shadow:0 8px 24px -8px rgba(255,107,26,.6)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:grid;place-items:center;color:var(--dim);transition:.15s;flex:none}
.ic:hover{color:var(--tx);border-color:var(--line2)}
.ic svg,.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.on{color:var(--or2);border-color:rgba(255,140,66,.45);background:rgba(255,107,26,.1)}
.ic.on.st svg{fill:currentColor}
.ic.del:hover{color:var(--bad);border-color:rgba(240,96,95,.5)}
.fld{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;transition:.15s}
.fld:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,107,26,.18)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.lb{display:block;margin:16px 0 6px;color:var(--dim);font-size:12.5px;font-weight:500}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.lcard{width:100%;max-width:400px;padding:34px 30px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:20px;box-shadow:0 40px 80px -30px #000}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--or2),var(--or));display:grid;place-items:center;font:italic 600 24px var(--serif);color:#1a0d02;box-shadow:0 10px 26px -8px rgba(255,107,26,.7)}
.lcard h1{font:600 34px/1.1 var(--serif);margin:22px 0 6px;letter-spacing:-.01em}
.lcard p{margin:0 0 6px;color:var(--dim)}
.err{color:var(--bad);margin-top:12px;font-size:13px}
/* top */
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,13,10,.82);backdrop-filter:blur(14px)}
.top .mark{width:36px;height:36px;font-size:19px;border-radius:10px}
.top b{font:600 18px var(--serif)}
.sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:30px clamp(16px,4vw,40px) 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.head h1{font:400 clamp(40px,7vw,76px)/.95 var(--serif);letter-spacing:-.03em;margin:0}
.head h1 i{color:var(--or2)}
.stats{display:flex;margin:30px 0 26px;border-block:1px solid var(--line)}
.stat{flex:1;padding:16px 0 16px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:400 clamp(26px,4vw,40px)/1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.stat span{color:var(--dim);font-size:12.5px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.srch{position:relative;flex:1;min-width:220px}
.srch svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8}
.srch .fld{padding-left:38px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:99px;padding:7px 14px;color:var(--dim);transition:.15s;white-space:nowrap}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--tx);border-color:var(--tx);color:#18110a;font-weight:600}
.chip.warn:not(.on){color:var(--or2);border-color:rgba(255,140,66,.45)}
.chip small{opacity:.6;margin-left:4px}
/* wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 26px;margin-top:22px;align-items:start}
@media(max-width:560px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}.stat{padding-left:10px}.stat span{font-size:11px}}
.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.frame,.plaque{cursor:pointer}
.work.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*28ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.frame{position:relative;padding:8px;border-radius:3px;background:linear-gradient(135deg,#4a3420,#1c130b 48%,#3d2b1a);box-shadow:0 26px 36px -16px #000,0 0 0 1px rgba(255,190,120,.12),inset 0 1px 0 rgba(255,210,150,.25);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.frame::after{content:"";position:absolute;inset:8px;box-shadow:inset 0 0 14px rgba(0,0,0,.55);pointer-events:none}
@media(hover:hover){.work:hover .frame{transform:translateY(-4px);box-shadow:0 36px 46px -18px #000,0 0 40px -6px rgba(255,140,66,.28),0 0 0 1px rgba(255,190,120,.25),inset 0 1px 0 rgba(255,210,150,.3)}}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#0b0805}
.work.paysage .frame img{aspect-ratio:5/4}.work.carre .frame img{aspect-ratio:1}
.work.off .frame{filter:grayscale(.85) brightness(.6)}
.badge{position:absolute;top:-9px;right:-9px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--or);color:#1a0d02;display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(255,107,26,.8)}
.badge svg{width:14px;height:14px;fill:currentColor}
.plaque{padding:0 2px}
.plaque h3{font:600 15.5px/1.25 var(--serif);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plaque .m{display:flex;justify-content:space-between;gap:8px;color:var(--faint);font-size:12px;margin-top:4px}
.plaque .m span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font:italic 400 19px var(--serif);color:var(--or2);margin-top:6px}
.tag{display:inline-block;margin-left:8px;font:500 11px var(--sans);color:var(--or2);border:1px dashed rgba(255,140,66,.6);border-radius:99px;padding:1px 8px;vertical-align:2px;font-style:normal}
.acts{display:flex;gap:6px}
.acts .ic{flex:1;width:auto;height:34px}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--dim)}
.empty b{display:block;font:400 26px var(--serif);color:var(--tx);margin-bottom:6px}
.sk .frame img{animation:pulse 1.4s infinite alternate}
@keyframes pulse{to{opacity:.4}}
/* sheet */
.bg{position:fixed;inset:0;z-index:50;background:rgba(6,4,2,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;max-height:94dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;animation:up .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -30px 80px -20px #000}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.bg{align-items:center}.sheet{border-radius:22px;max-height:90dvh}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 6px}
.sh h2{font:600 24px var(--serif);margin:0}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--dim);margin-bottom:-1px}
.tab.on{color:var(--tx);border-color:var(--or);font-weight:600}
.sb{padding:4px 24px 22px;overflow:auto;flex:1}
.sf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line2);border-radius:14px;padding:12px;cursor:pointer;color:var(--dim);transition:.15s;min-height:150px;background:rgba(0,0,0,.2)}
.drop:hover,.drop.over{border-color:var(--or);background:rgba(255,107,26,.06)}
.drop img{max-height:240px;max-width:100%;border:6px solid #2e2013;box-shadow:0 14px 30px -10px #000}
.sw{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.sw small{display:block;color:var(--faint)}
.tg{width:46px;height:27px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.06);position:relative;transition:.2s;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:.2s}
.tg.on{background:var(--or);border-color:var(--or)}.tg.on::after{left:22px;background:#fff}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .fld{padding:8px 10px}
.row.off .nm{opacity:.45;text-decoration:line-through}
.nm{flex:1;min-width:0}
.note{background:rgba(255,107,26,.08);border:1px solid rgba(255,140,66,.3);color:var(--or2);padding:10px 13px;border-radius:10px;margin:14px 0 4px;font-size:13px}
.note.ok{background:rgba(92,196,140,.08);border-color:rgba(92,196,140,.35);color:var(--ok)}
.mx{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.mx th{font-weight:500;color:var(--dim);text-align:left;padding:4px 6px;font-size:12.5px}
.mx td{padding:0 4px 0 0}.mx td:first-child{padding-right:10px;white-space:nowrap}
.mx .fld{padding:8px;min-width:76px}
.mx .gap{border-style:dashed;border-color:rgba(255,140,66,.65)}
.sp2{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{rotate:1turn}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:90;background:var(--tx);color:#18110a;padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 20px 40px -10px #000;animation:up .3s}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- phone ---------- */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.chip,.drop{touch-action:manipulation}
body:has(.bg){overflow:hidden}
.fab{display:none}
.sf{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.top,main{padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px))}
@media(hover:none){body::before{background:radial-gradient(90vw circle at 50% -8%,rgba(255,160,80,.14),transparent 70%)}}
@media(max-width:700px){
  .fld,select.fld,.mx .fld,.row .fld{font-size:16px}
  .top{position:static;padding-top:12px;padding-bottom:12px}
  .top .lbl,.bar .lbl{display:none}
  .top .btn,.bar .btn{padding:0;width:42px;height:42px}
  main{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .head .btn{display:none}
  .head h1{font-size:44px}
  .stats{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 6px}
  .stat{border-left:0;border-top:1px solid var(--line);padding:13px 0 13px 14px}
  .stat:nth-child(odd){padding-left:0}.stat:nth-child(even){border-left:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}
  .tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin:0 -16px;padding:10px 16px 0;background:linear-gradient(var(--wall) 82%,rgba(16,13,10,0));}
  .bar{flex-wrap:nowrap}.srch{min-width:0}
  .fld{padding:12px 13px}.srch .fld{padding-left:38px}
  .chips{margin:0 -16px;padding:10px 16px 12px}
  .chip{padding:9px 15px}
  .wall{margin-top:14px}
  .acts{gap:5px}.acts .ic{height:42px;border-radius:12px}
  .plaque h3{font-size:14.5px}.price{font-size:18px}
  .plaque .m{flex-direction:column;gap:1px}.plaque .m span{white-space:normal}
  .tag{display:block;width:fit-content;margin:5px 0 0;font-size:10.5px}
  .badge{top:-7px;right:-7px}
  .fab{display:inline-flex;position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;padding:0 22px 0 18px;border-radius:99px;font-size:15px;box-shadow:0 16px 34px -8px rgba(255,107,26,.75),0 0 0 1px rgba(255,255,255,.08) inset}
  body:has(.bg) .fab{display:none}
  .sheet{max-height:94dvh;border-radius:24px 24px 0 0}
  .sheet::before{content:"";align-self:center;width:42px;height:4px;border-radius:9px;background:var(--line2);margin-top:8px}
  .sh{padding:12px 18px 4px}.sh h2{font-size:22px}
  .tabs{padding:8px 12px 0;overflow-x:auto}.tab{padding:11px 14px;flex:1}
  .sb{padding:4px 18px 20px;overscroll-behavior:contain}
  .sf{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}.sf .btn{flex:1;height:48px}
  .ic{width:42px;height:42px}
  .row .ic{width:40px;height:40px}
  .drop{min-height:130px}.drop img{max-height:200px}
  .toast{max-width:calc(100vw - 32px);bottom:calc(86px + env(safe-area-inset-bottom,0px));text-align:center}
  .lcard{padding:28px 22px;border-radius:18px}.lcard h1{font-size:30px}
}
@media(max-width:360px){.wall{gap:22px 10px}.acts .ic{height:38px}.head h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB='https://tytxvwndshhvmbdzalao.supabase.co',KEY='sb_publishable_UkOf17oN1aGnCaGNvS3Guw_a8ttwkjK';
const db=supabase.createClient(SB,KEY);
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/>',off:'<path d="M9.9 4.2A11 11 0 0 1 12 4c7 0 11 7 11 7a18 18 0 0 1-3 4M6.1 6.1A18 18 0 0 0 1 11s4 7 11 7a11 11 0 0 0 5.9-1.6M1 1l22 22"/>',star:'<path d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.7l-6.1 3.1 1.4-6.7-5-4.7 6.8-.7Z"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const FORMATS=[['portrait','Portrait'],['paysage','Paysage'],['carre','Carré']];
const S={cats:[],arts:[],sizes:[],frames:[],prices:[],q:'',cat:'all',first:true,user:null};
const app=$('#app');
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const money=n=>Number(n).toLocaleString('fr-TN',{maximumFractionDigits:3});
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
addEventListener('pointermove',e=>{const r=document.documentElement.style;r.setProperty('--mx',e.clientX+'px');r.setProperty('--my',e.clientY+'px')},{passive:true});

/* ---------- auth ---------- */
function login(msg){
  app.innerHTML=`<div class="login"><form class="lcard" id="lf"><div class="mark">S</div><h1>Bonjour Samar</h1><p>Connectez-vous pour gérer votre galerie.</p>
  <label class="lb" for="em">Email</label><input class="fld" id="em" type="email" autocomplete="username" required>
  <label class="lb" for="pw">Mot de passe</label><input class="fld" id="pw" type="password" autocomplete="current-password" required>
  ${msg?`<div class="err" role="alert">${esc(msg)}</div>`:''}
  <button class="btn pri" style="width:100%;margin-top:24px" id="lb">Se connecter</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.innerHTML='<i class="sp2"></i>';
    const{data,error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)return login('Email ou mot de passe incorrect.');
    if(!await isAdmin(data.user)){await db.auth.signOut();return login("Ce compte n'a pas accès à l'administration.")}
    start()};
}
async function isAdmin(u){const{data}=await db.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();return !!data}
async function all(table,cols){let out=[],i=0;for(;;){const{data,error}=await db.from(table).select(cols).range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)return out;i+=1000}}

/* ---------- dashboard ---------- */
function start(){
  app.innerHTML=`<header class="top"><div class="mark">S</div><b>Samart</b><div class="sp"></div><button class="btn" id="out">${ic('out')}<span class="lbl">Déconnexion</span></button></header>
  <main><div class="head"><h1 id="h1">Galerie</h1><button class="btn pri" id="add">${ic('plus')}Nouvelle œuvre</button></div>
  <button class="btn pri fab" id="fab" aria-label="Nouvelle œuvre">${ic('plus')}<span>Ajouter</span></button>
  <div class="stats" id="stats"></div>
  <div class="tools"><div class="bar"><div class="srch">${ic('search')}<input class="fld" id="q" placeholder="Titre ou référence" enterkeyhint="search" autocomplete="off" aria-label="Rechercher"></div><button class="btn" id="cats">${ic('tag')}<span class="lbl">Catégories</span></button></div>
  <div class="chips" id="chips"></div></div><div class="wall" id="wall"></div></main>`;
  $('#out').onclick=async()=>{await db.auth.signOut();login()};
  $('#add').onclick=$('#fab').onclick=()=>editor(null);$('#cats').onclick=catsSheet;
  $('#q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();wall()};
  $('#wall').onclick=onWall;
  $('#wall').innerHTML=Array(8).fill('<div class="work sk"><div class="frame"><img alt=""></div></div>').join('');
  load();
}
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT/.test(document.activeElement.tagName)&&$('#q')){e.preventDefault();$('#q').focus()}if(e.key==='Escape'){const b=[...document.querySelectorAll('.bg')].pop();b&&b.remove()}});
async function load(){
  try{
    const[c,a,sz,fr,pr]=await Promise.all([db.from('categories').select('*').order('sort_order'),db.from('artworks').select('*').order('sort_order').order('id',{ascending:false}),all('artwork_sizes','id,artwork_id,is_active'),all('artwork_frames','id,artwork_id,is_active'),all('artwork_frame_prices','size_id,frame_id')]);
    if(c.error||a.error)throw c.error||a.error;
    S.cats=c.data;S.arts=a.data;S.sizes=sz;S.frames=fr;S.prices=new Set(pr.map(p=>p.size_id+':'+p.frame_id));
  }catch(e){toast('Chargement impossible : '+(e.message||e),true);return}
  stats();wall();
}
function gaps(a){const z=S.sizes.filter(s=>s.artwork_id===a.id&&s.is_active),f=S.frames.filter(s=>s.artwork_id===a.id&&s.is_active);let n=0;z.forEach(s=>f.forEach(r=>{if(!S.prices.has(s.id+':'+r.id))n++}));return n}
function stats(){
  const A=S.arts,n=A.length,vis=A.filter(a=>a.is_active).length,fe=A.filter(a=>a.featured).length,avg=n?Math.round(A.reduce((t,a)=>t+Number(a.base_price),0)/n):0;
  $('#h1').textContent=n+(n>1?' œuvres':' œuvre');
  $('#stats').innerHTML=[[vis,'visibles sur le site'],[n-vis,'masquées'],[fe,'mises en avant'],[avg+' TND','prix moyen']].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}
function wall(){
  const A=S.arts,inc=A.filter(a=>gaps(a)>0).length,cnt=id=>A.filter(a=>a.category===id).length;
  $('#chips').innerHTML=`<button class="chip ${S.cat==='all'?'on':''}" data-c="all">Toutes<small>${A.length}</small></button>`+S.cats.map(c=>`<button class="chip ${S.cat===c.id?'on':''}" data-c="${esc(c.id)}">${esc(c.label)}<small>${cnt(c.id)}</small></button>`).join('')+(inc?`<button class="chip warn ${S.cat==='_gap'?'on':''}" data-c="_gap">Prix à compléter<small>${inc}</small></button>`:'');
  $('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){S.cat=b.dataset.c;wall()}};
  const L=A.filter(a=>(S.cat==='all'||(S.cat==='_gap'?gaps(a)>0:a.category===S.cat))&&(!S.q||a.title.toLowerCase().includes(S.q)||String(a.reference).toLowerCase().includes(S.q)));
  const lab=Object.fromEntries(S.cats.map(c=>[c.id,c.label])),anim=S.first;S.first=false;
  $('#wall').innerHTML=L.length?L.map((a,i)=>{const g=gaps(a);return`<article data-id="${a.id}" class="work ${esc(a.format)} ${a.is_active?'':'off'} ${anim?'in':''}" style="--i:${Math.min(i,24)}">
  <div class="frame">${a.featured?`<span class="badge" title="Mise en avant">${ic('star')}</span>`:''}<img src="${esc(a.image_url)}" alt="${esc(a.title)}" loading="lazy"></div>
  <div class="plaque"><h3>${esc(a.title)}</h3><div class="m"><span>${esc(lab[a.category]||a.category)}</span><span>${esc(a.reference)}</span></div>
  <div class="price">${money(a.base_price)} TND${g?`<span class="tag" title="${g} prix de cadre manquant(s)">${g} prix manquant${g>1?'s':''}</span>`:''}</div></div>
  <div class="acts"><button class="ic ${a.is_active?'on':''}" data-a="active" data-id="${a.id}" aria-label="${a.is_active?'Masquer':'Afficher'} sur le site" title="${a.is_active?'Visible':'Masquée'}">${ic(a.is_active?'eye':'off')}</button>
  <button class="ic st ${a.featured?'on':''}" data-a="featured" data-id="${a.id}" aria-label="${a.featured?'Retirer de la mise en avant':'Mettre en avant'}" title="Mise en avant">${ic('star')}</button>
  <button class="ic" data-a="edit" data-id="${a.id}" aria-label="Modifier" title="Modifier">${ic('edit')}</button>
  <button class="ic del" data-a="del" data-id="${a.id}" aria-label="Supprimer" title="Supprimer">${ic('trash')}</button></div></article>`}).join(''):`<div class="empty"><b>Aucune œuvre ici</b>Changez la recherche ou ajoutez une nouvelle œuvre.</div>`;
}
async function onWall(e){
  const b=e.target.closest('[data-a]');const w=b||e.target.closest('.work');if(!w)return;const a=S.arts.find(x=>x.id==w.dataset.id);if(!a)return;if(!b)return editor(a.id);
  if(b.dataset.a==='edit')return editor(a.id);
  if(b.dataset.a==='del'){if(!confirm(`Supprimer définitivement « ${a.title} » ?`))return;
    const{error}=await db.from('artworks').delete().eq('id',a.id);if(error)return toast(error.message,true);S.arts=S.arts.filter(x=>x!==a);toast('Œuvre supprimée.');stats();return wall()}
  const k=b.dataset.a;a[k]=!a[k];stats();wall();
  const{error}=await db.from('artworks').update({[k]:a[k]}).eq('id',a.id);
  if(error){a[k]=!a[k];stats();wall();toast(error.message,true)}
}

/* ---------- sheets ---------- */
function sheet(title,id){
  const bg=document.createElement('div');bg.className='bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="ic" id="x" aria-label="Fermer">${ic('x')}</button></div><div id="tabs"></div><div class="sb" id="sb"></div><div class="sf" id="sf"></div></div>`;
  document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};$('#x',bg).onclick=()=>bg.remove();return bg;
}
let upload=null;
function editor(id){
  const a=id?S.arts.find(x=>x.id===id):{title:'',category:S.cats[0]?.id,format:'portrait',base_price:'',image_url:'',is_active:true,featured:false};
  const bg=sheet(id?"Modifier l'œuvre":'Nouvelle œuvre');upload=null;let tab='fiche';
  const draw=()=>{
    $('#tabs',bg).innerHTML=id?`<div class="tabs">${[['fiche','Fiche'],['tailles','Tailles'],['cadres','Cadres'],['prix','Prix']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>`:'';
    $('#tabs',bg).onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw()}};
    if(tab==='fiche')fiche(bg,a,id);else if(tab==='prix')matrix(bg,id);else list(bg,id,tab==='tailles');
  };draw();
}
function fiche(bg,a,id){
  const sb=$('#sb',bg);
  sb.innerHTML=`<label class="lb">Photo</label><div class="drop" id="drop" tabindex="0" role="button">${a.image_url?`<img id="pv" src="${esc(a.image_url)}" alt="">`:`<div id="pt"><b style="color:var(--tx)">Ajouter une photo</b><br>Touchez pour choisir, ou glissez-la ici</div>`}<input type="file" accept="image/*" id="fi" class="hide"></div>
  <label class="lb" for="t">Titre</label><input class="fld" id="t" value="${esc(a.title)}" placeholder="Tableau minimaliste en relief">
  <div class="g2"><div><label class="lb" for="p">Prix de base (TND)</label><input class="fld" id="p" type="number" min="0" step="1" inputmode="decimal" value="${esc(a.base_price)}"></div>
  <div><label class="lb" for="f">Format</label><select class="fld" id="f">${FORMATS.map(([v,l])=>`<option value="${v}" ${a.format===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <label class="lb" for="c">Catégorie</label><select class="fld" id="c">${S.cats.map(c=>`<option value="${esc(c.id)}" ${a.category===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select>
  ${id?`<div class="lb" style="margin-bottom:0">Référence : <b style="color:var(--tx)">${esc(a.reference)}</b></div>`:''}
  <div class="sw" style="margin-top:14px"><div>Visible sur le site<small>Les visiteurs voient cette œuvre</small></div><button class="tg ${a.is_active?'on':''}" id="s1" aria-label="Visible"></button></div>
  <div class="sw"><div>Mise en avant<small>Affichée en premier sur l'accueil</small></div><button class="tg ${a.featured?'on':''}" id="s2" aria-label="Mise en avant"></button></div>
  ${id?'':'<div class="note">Enregistrez la fiche pour ajouter ses tailles, cadres et prix.</div>'}`;
  $('#sf',bg).innerHTML=`<button class="btn" id="no">Annuler</button><button class="btn pri" id="ok">Enregistrer</button>`;
  $('#no',bg).onclick=()=>bg.remove();
  ['s1','s2'].forEach(i=>$('#'+i,bg).onclick=e=>e.currentTarget.classList.toggle('on'));
  const drop=$('#drop',bg),fi=$('#fi',bg);
  const pick=f=>{if(!f||!f.type.startsWith('image/'))return;upload=f;drop.querySelector('img,#pt')?.remove();const im=new Image();im.id='pv';im.src=URL.createObjectURL(f);drop.prepend(im)};
  drop.onclick=()=>fi.click();drop.onkeydown=e=>{if(e.key==='Enter')fi.click()};fi.onclick=e=>e.stopPropagation();fi.onchange=()=>pick(fi.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');pick(e.dataTransfer.files[0])};
  $('#ok',bg).onclick=async e=>{
    const t=$('#t',bg).value.trim(),p=parseFloat($('#p',bg).value);
    if(!t||isNaN(p))return toast('Le titre et le prix sont requis.',true);
    const b=e.currentTarget;b.disabled=true;b.innerHTML='<i class="sp2"></i>';
    try{
      let url=a.image_url;if(upload)url=await send(upload,t);
      if(!url){b.disabled=false;b.textContent='Enregistrer';return toast('Ajoutez une photo.',true)}
      const row={title:t,category:$('#c',bg).value,format:$('#f',bg).value,colors:[],base_price:p,image_url:url,mockup_image_url:url,is_active:$('#s1',bg).classList.contains('on'),featured:$('#s2',bg).classList.contains('on')};
      const r=id?await db.from('artworks').update(row).eq('id',id):await db.from('artworks').insert(row);
      if(r.error)throw r.error;toast(id?'Œuvre mise à jour.':'Œuvre ajoutée.');bg.remove();load();
    }catch(err){b.disabled=false;b.textContent='Enregistrer';toast('Erreur : '+(err.message||err),true)}
  };
}
function webp(f){return new Promise((ok,ko)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);let w=im.width,h=im.height;const k=1600/Math.max(w,h);if(k<1){w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>b&&b.type==='image/webp'?ok(b):ko(),'image/webp',.82)};im.onerror=ko;im.src=u})}
async function send(f,title){
  let body=f,webpOk=false;try{body=await webp(f);webpOk=true}catch{}
  const name=`${title.replace(/[^a-zA-Z0-9-_]/g,'')||'oeuvre'}-${Date.now()}.${webpOk?'webp':(f.name.split('.').pop()||'jpg').toLowerCase()}`;
  const{error}=await db.storage.from('artwork-images').upload(name,body,{upsert:true,contentType:webpOk?'image/webp':f.type});if(error)throw error;
  return db.storage.from('artwork-images').getPublicUrl(name).data.publicUrl;
}
async function list(bg,id,isSize){
  const T=isSize?'artwork_sizes':'artwork_frames',sb=$('#sb',bg);$('#sf',bg).innerHTML='<button class="btn" id="no">Fermer</button>';$('#no',bg).onclick=()=>{bg.remove();load()};
  const get=async()=>(await db.from(T).select('*').eq('artwork_id',id).order('sort_order')).data||[];
  let R=await get();
  const draw=()=>{
    sb.innerHTML=(R.length?R.map(r=>`<div class="row ${r.is_active?'':'off'}"><span class="nm">${esc(r.label)}</span>${isSize?`<input class="fld" style="width:96px" type="number" step="1" value="${Number(r.price_modifier)}" data-p="${r.id}" aria-label="Supplément de ${esc(r.label)}">`:''}
    <button class="ic ${r.is_active?'on':''}" data-v="${r.id}" aria-label="Activer ou désactiver">${ic(r.is_active?'eye':'off')}</button><button class="ic del" data-d="${r.id}" aria-label="Supprimer">${ic('trash')}</button></div>`).join(''):`<div class="note">${isSize?'Aucune taille. Le prix de base s’applique seul.':'Aucun cadre pour cette œuvre.'}</div>`)+
    `${isSize&&R.length?'<div class="lb">Le supplément (TND) s’ajoute au prix de base.</div>':''}<label class="lb">${isSize?'Nouvelle taille':'Nouveau cadre'}</label><div style="display:flex;gap:8px"><input class="fld" id="nl" placeholder="${isSize?'ex : 50×70 cm':'ex : Chêne noir'}">${isSize?'<input class="fld" id="np" type="number" placeholder="+ TND" style="width:100px">':''}<button class="btn pri" id="na">${ic('plus')}</button></div>`;
    sb.querySelectorAll('[data-p]').forEach(i=>i.onchange=async()=>{const{error}=await db.from(T).update({price_modifier:parseFloat(i.value)||0}).eq('id',i.dataset.p);toast(error?error.message:'Supplément mis à jour.',!!error)});
    sb.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const r=R.find(x=>x.id==b.dataset.v);await db.from(T).update({is_active:!r.is_active}).eq('id',r.id);R=await get();draw()});
    sb.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ?'))return;const{error}=await db.from(T).delete().eq('id',b.dataset.d);if(error)return toast(error.message,true);R=await get();draw()});
    $('#na',bg).onclick=async()=>{const l=$('#nl',bg).value.trim();if(!l)return toast('Donnez un nom.',true);const row={artwork_id:id,label:l,sort_order:R.length+1};if(isSize)row.price_modifier=parseFloat($('#np',bg).value)||0;
      const{error}=await db.from(T).insert(row);if(error)return toast(error.message,true);R=await get();draw();toast(isSize?'Taille ajoutée.':'Cadre ajouté. Pensez à fixer ses prix dans l’onglet Prix.')};
  };draw();
}
async function matrix(bg,id){
  const sb=$('#sb',bg);$('#sf',bg).innerHTML='<button class="btn" id="no">Fermer</button>';$('#no',bg).onclick=()=>{bg.remove();load()};
  sb.innerHTML='<div class="empty"><i class="sp2"></i></div>';
  const[z,f]=await Promise.all([db.from('artwork_sizes').select('*').eq('artwork_id',id).order('sort_order'),db.from('artwork_frames').select('*').eq('artwork_id',id).order('sort_order')]);
  const Z=z.data||[],F=f.data||[];
  if(!Z.length||!F.length){sb.innerHTML='<div class="note">Ajoutez au moins une taille et un cadre pour fixer des prix.</div>';return}
  const pull=async()=>{const{data}=await db.from('artwork_frame_prices').select('*').in('size_id',Z.map(s=>s.id));return new Map((data||[]).map(p=>[p.size_id+':'+p.frame_id,p.price]))};
  let M=await pull();
  const draw=()=>{
    const miss=Z.length*F.length-M.size;
    sb.innerHTML=`<div class="note ${miss?'':'ok'}">${miss?`${miss} prix à renseigner (cases en pointillés).`:'Tous les prix sont renseignés.'}</div>
    <p class="lb" style="margin:12px 0 0">Prix du cadre selon la taille, en TND. Videz une case pour retirer la combinaison.</p>
    <div style="overflow-x:auto"><table class="mx"><tr><th></th>${F.map(r=>`<th>${esc(r.label)}</th>`).join('')}</tr>${Z.map(s=>`<tr><td>${esc(s.label)}</td>${F.map(r=>{const v=M.get(s.id+':'+r.id);return`<td><input class="fld ${v==null?'gap':''}" type="number" min="0" inputmode="decimal" value="${v??''}" placeholder="—" data-s="${s.id}" data-f="${r.id}" aria-label="${esc(s.label)}, ${esc(r.label)}"></td>`}).join('')}</tr>`).join('')}</table></div>`;
    sb.querySelectorAll('input').forEach(i=>i.onchange=async()=>{
      const v=i.value.trim(),q=db.from('artwork_frame_prices');
      const{error}=v===''?await q.delete().eq('size_id',i.dataset.s).eq('frame_id',i.dataset.f):await q.upsert({size_id:+i.dataset.s,frame_id:+i.dataset.f,price:parseFloat(v)||0});
      if(error)return toast(error.message,true);M=await pull();draw()});
  };draw();
}
function catsSheet(){
  const bg=sheet('Catégories');$('#sf',bg).innerHTML='<button class="btn" id="no">Fermer</button>';$('#no',bg).onclick=()=>bg.remove();
  const draw=()=>{
    $('#sb',bg).innerHTML=(S.cats.map(c=>`<div class="row"><input class="fld nm" value="${esc(c.label)}" data-r="${esc(c.id)}" aria-label="Renommer"><span style="color:var(--faint);font-size:12px">${S.arts.filter(a=>a.category===c.id).length} œuvres</span><button class="ic del" data-d="${esc(c.id)}" aria-label="Supprimer">${ic('trash')}</button></div>`).join('')||'<div class="note">Aucune catégorie.</div>')+
    `<label class="lb">Nouvelle catégorie</label><div style="display:flex;gap:8px"><input class="fld" id="nc" placeholder="ex : Abstrait"><button class="btn pri" id="na">Ajouter</button></div>`;
    $('#sb',bg).querySelectorAll('[data-r]').forEach(i=>i.onchange=async()=>{const l=i.value.trim();if(!l)return;const{error}=await db.from('categories').update({label:l}).eq('id',i.dataset.r);if(error)return toast(error.message,true);S.cats.find(c=>c.id===i.dataset.r).label=l;wall();toast('Catégorie renommée.')});
    $('#sb',bg).querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const id=b.dataset.d;if(S.arts.some(a=>a.category===id)&&!confirm('Des œuvres utilisent encore cette catégorie. La supprimer quand même ?'))return;const{error}=await db.from('categories').delete().eq('id',id);if(error)return toast(error.message,true);S.cats=S.cats.filter(c=>c.id!==id);if(S.cat===id)S.cat='all';draw();wall()});
    $('#na',bg).onclick=async()=>{const l=$('#nc',bg).value.trim(),id=slug(l);if(!id)return toast('Donnez un nom valide.',true);const{error}=await db.from('categories').insert({id,label:l,sort_order:S.cats.length+1});if(error)return toast(error.message,true);S.cats.push({id,label:l});draw();wall();toast('Catégorie ajoutée.')};
  };draw();
}
/* boot */
(async()=>{
  const{data}=await db.auth.getSession();
  if(data.session&&await isAdmin(data.session.user))start();else login();
})();
</script>
